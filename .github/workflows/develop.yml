name: Pruebas Develop

on:
  push:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Verificar que existe index.html
        run: |
          test -f index.html
          echo "index.html existe"

      - name: Verificar contenido básico
        run: |
          grep -q "<html" index.html
          grep -q "<title>" index.html
          grep -q "<body>" index.html
          echo "HTML válido para nuestras pruebas básicas"